name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Show registered tools (fastmcp)
        run: |
          python -m vulnwatch_mcp --help >/dev/null 2>&1 || true
          python -c "from vulnwatch_mcp import mcp; import asyncio; t=asyncio.run(mcp.list_tools()); print('tools:', sorted(x.name for x in t))"
      - name: Test (pytest)
        run: |
          pytest